services:
  archive-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slack_archive
      POSTGRES_USER: archive_admin
      POSTGRES_PASSWORD: synthetic_admin_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - archive_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive_admin -d slack_archive"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  archive_postgres_data:
